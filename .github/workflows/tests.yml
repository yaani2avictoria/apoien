name: Python tests
on:
  push:
    branches: [main, ci/github-actions]
    paths: ['transcritor/**', 'tools/**', 'tests/**', 'requirements*.txt', 'requirements*.lock', '.github/workflows/**']
  pull_request:
    paths: ['transcritor/**', 'tools/**', 'tests/**', 'requirements*.txt', 'requirements*.lock', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned test/runtime dependencies
        run: python -m pip install --requirement requirements-ci.lock --retries 0 --timeout 20
      - name: Check installed dependencies
        run: python -m pip check
      - name: Offline unit tests and import/decoder smoke test
        run: python tools/run_ci_tests.py --output artifacts/tests
      - name: CLI startup without external requests
        run: |
          python -m transcritor --help
          python -m transcritor.diagnostico --help
          python tools/testar_gemini_youtube.py --help
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/tests/
          if-no-files-found: warn
          retention-days: 1
